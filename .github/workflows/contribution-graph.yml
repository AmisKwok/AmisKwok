name: Update Contribution Graph

on:
  schedule:
    - cron: "0 0 * * *"      # daily
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/generate_contribution_graph.py"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate contribution graph SVG
        run: python scripts/generate_contribution_graph.py

      - name: Commit updated SVG
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update contribution graph"
          file_pattern: images/contribution-graph.svg
          commit_user_name: github-actions[bot]
          commit_user_email: github-actions[bot]@users.noreply.github.com
